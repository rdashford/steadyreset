# XcodeGen spec. Run `xcodegen generate` in this folder to produce SteadyReset.xcodeproj.
# Install: `brew install xcodegen`. Never hand-edit the generated .pbxproj; edit this file and regenerate.
name: SteadyReset
options:
  bundleIdPrefix: app.steadyreset
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""   # set your Team ID
packages:
  SteadyCore:
    path: Packages/SteadyCore
targets:
  SteadyReset:
    type: application
    platform: iOS
    sources: [App/SteadyReset]
    dependencies:
      - package: SteadyCore
      - target: SteadyResetWidgets
      - target: SteadyResetWatch
    info:
      path: App/SteadyReset/Info.plist
      properties:
        CFBundleDisplayName: Steady Reset
        UIBackgroundModes: [remote-notification]
        NSHealthShareUsageDescription: "Steady Reset reads heart rate, heart rate variability, resting heart rate, sleep, respiratory rate and wrist temperature from Health to show you your own baselines. Nothing leaves your device."
        NSHealthUpdateUsageDescription: "Optionally saves each reset to Health as a Mindful Session."
        NSSpeechRecognitionUsageDescription: "Turns what you say into text on this device so you can talk instead of type."
        NSMicrophoneUsageDescription: "Lets you speak to the companion and record a secure-base voice note."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/SteadyReset/SteadyReset.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.usernotifications.time-sensitive: true
        # RULE 4 HAZARD. CloudKit is enabled on the app that owns Session, which
        # carries HealthKit-derived hrBefore/hrAfter plus user text (debriefNote,
        # Hold.draft). Nothing syncs today because no ModelConfiguration requests
        # cloudKitDatabase — adding one would push biosignals off-device BY
        # DEFAULT. Before enabling sync (session 2.14), split into two
        # ModelConfigurations: CloudKit-backed for plan/preferences, local-only
        # for Session/Hold, so the biosignal fields structurally cannot leave.
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.app.steadyreset]
        com.apple.security.application-groups: [group.app.steadyreset]
  SteadyResetWidgets:
    type: app-extension
    platform: iOS
    sources: [App/SteadyResetWidgets, App/SteadyReset/Intents]
    # An app extension's bundle ID must be a CHILD of its host app's, not a
    # sibling. bundleIdPrefix alone yields app.steadyreset.SteadyResetWidgets,
    # which the installer rejects, so set it explicitly.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.steadyreset.SteadyReset.Widgets
    dependencies:
      - package: SteadyCore
    info:
      path: App/SteadyResetWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/SteadyResetWidgets/SteadyResetWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.steadyreset]
  SteadyResetWatch:
    # Modern single-target watchOS app. `application.watchapp2` is the legacy
    # WatchKit-2 product type that expects a paired extension target; it emits
    # duplicate binary outputs under the watchsimulator SDK.
    type: application
    platform: watchOS
    sources: [App/SteadyResetWatch]
    # Must be a child of WKCompanionAppBundleIdentifier below, or watchOS
    # refuses to install the app alongside its companion.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.steadyreset.SteadyReset.watchkitapp
    dependencies:
      - package: SteadyCore
    info:
      path: App/SteadyResetWatch/Info.plist
      properties:
        # WKApplication marks a modern single-target watchOS app; without it
        # the bundle builds but simctl/watchOS refuse to install it.
        # It supersedes the legacy watchapp2 WKRunsIndependentlyOfCompanionApp.
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.steadyreset.SteadyReset
    entitlements:
      path: App/SteadyResetWatch/SteadyResetWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
schemes:
  SteadyReset:
    build: { targets: { SteadyReset: all } }
    run: { config: Debug }
    # SteadyCore unit tests are SPM tests, not an Xcode target: run them with
    # `cd Packages/SteadyCore && swift test`. XCUITest targets get added here
    # when the first UI test lands (Phase 1).
  SteadyResetWatch:
    build: { targets: { SteadyResetWatch: all } }
    run: { config: Debug }
